name: Flowzone
on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main, master]
  push:
    branches: [main, master]
permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  flowzone:
    name: Flowzone
    uses: product-os/flowzone/.github/workflows/flowzone.yml@master # flowzonify 0.4.23
    secrets: inherit
    # there currently no way to generate a SBOM on a windows runnner
    with:
      custom_test_matrix: >
        {
          "os": [["windows-2022"]]
        }
      generate_sbom: false
